<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Maskaglia discrete Gaussian sampler</title>
  <desc id="desc">A discrete Gaussian drawn as bars over integer points</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151c34"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5b5bd6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#background)" stroke="#2a3553" stroke-width="2"/>

  <text x="64" y="116" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="56" font-weight="700">Maskaglia</text>
  <text x="64" y="165" fill="#a5b4fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24">masked discrete Gaussian sampling</text>
  <text x="64" y="228" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19">portable C99 · scalar and Boolean shared paths</text>

  <line x1="585" y1="288" x2="1128" y2="288" stroke="#64748b" stroke-width="2"/>
  <line x1="856" y1="58" x2="856" y2="300" stroke="#334155" stroke-width="2" stroke-dasharray="5 8"/>

  <g fill="url(#bar)">
    <rect x="606" y="280" width="30" height="8" rx="5"/>
    <rect x="654" y="270" width="30" height="18" rx="5"/>
    <rect x="702" y="244" width="30" height="44" rx="5"/>
    <rect x="750" y="188" width="30" height="100" rx="5"/>
    <rect x="798" y="108" width="30" height="180" rx="5"/>
    <rect x="846" y="67" width="30" height="221" rx="5" filter="url(#glow)"/>
    <rect x="894" y="108" width="30" height="180" rx="5"/>
    <rect x="942" y="188" width="30" height="100" rx="5"/>
    <rect x="990" y="244" width="30" height="44" rx="5"/>
    <rect x="1038" y="270" width="30" height="18" rx="5"/>
    <rect x="1086" y="280" width="30" height="8" rx="5"/>
  </g>

  <g fill="#94a3b8" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">
    <text x="616" y="317">-5</text>
    <text x="664" y="317">-4</text>
    <text x="712" y="317">-3</text>
    <text x="760" y="317">-2</text>
    <text x="808" y="317">-1</text>
    <text x="856" y="317">0</text>
    <text x="904" y="317">1</text>
    <text x="952" y="317">2</text>
    <text x="1000" y="317">3</text>
    <text x="1048" y="317">4</text>
    <text x="1096" y="317">5</text>
  </g>
</svg>
